<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Inchindown oil field</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#070707;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  canvas{display:block;width:100vw;height:100vh;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c');
let W,H;
const gl=cv.getContext('webgl',{antialias:false,preserveDrawingBuffer:false});

function resize(){
  W=window.innerWidth; H=window.innerHeight;
  cv.width=W; cv.height=H; cv.style.width=W+'px'; cv.style.height=H+'px';
  if(gl&&uRes)gl.uniform2f(uRes,W,H);
}

const VS=`attribute vec2 a;void main(){gl_Position=vec4(a,0,1);}`;

// Thin-film crude-oil: domain-warped fluid noise -> iridescent bands following
// flow contours, silvery plateaus, dark oily holes. Reacts to pointer.
// No film grain / scanlines / flicker / aberration / vignette.
const FS=`
precision highp float;
uniform vec2 res;
uniform float time;
uniform vec2 mouse;     // bottom-up pixels
uniform float mStr;
uniform float mClick;
uniform sampler2D distTex;
uniform vec2 seed;

float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){
  vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);
  float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
}
float fbm(vec2 p){
  float s=0.0,a=0.55; mat2 m=mat2(1.6,1.2,-1.2,1.6);
  for(int i=0;i<4;i++){ s+=a*noise(p); p=m*p; a*=0.5; }
  return s;
}
// thin-film spectral cycle, muted + metallic like a real oil slick
vec3 iri(float t){
  vec3 c = 0.5 + 0.5*cos(6.28318*(t + vec3(0.00,0.32,0.60)));
  c.r *= 0.88; c.g *= 0.78;                 // tame neon red + green
  float l = dot(c, vec3(0.299,0.587,0.114));
  c = mix(vec3(l), c, 0.42);                // strongly desaturate -> metallic
  c = mix(c, vec3(0.66,0.72,0.82), 0.20);   // silvery-blue sheen lift
  return c;
}

void main(){
  vec2 uv=gl_FragCoord.xy/res;
  float asp=res.x/res.y;
  vec2 fp=vec2(uv.x*asp,uv.y);          // aspect-correct flow space
  vec2 p=fp*2.4 + seed;

  float tm=time*0.018;
  float rip=texture2D(distTex,uv).r*8.0; // pointer drag field

  // pointer swirl
  vec2 mp=mouse/res; mp.x*=asp;
  float md=distance(fp,mp);
  float mInf=(mStr*1.1+mClick*2.2)*exp(-md*md/0.05);
  vec2 swirl=vec2(-(fp.y-mp.y),(fp.x-mp.x))/(md+0.08)*mInf*0.5;

  // ── domain warp (marbled fluid flow) ──
  vec2 q=vec2(fbm(p+vec2(0.0,tm)), fbm(p+vec2(5.2,1.3)-tm));
  q+=swirl + rip*0.25;
  vec2 r=vec2(fbm(p+2.3*q+vec2(1.7,9.2)+tm*0.7), fbm(p+2.3*q+vec2(8.3,2.8)-tm*0.6));
  float thick=fbm(p+3.6*r);
  thick+=rip*0.55 + mInf*0.35;

  // ── thin-film iridescent bands following the flow ──
  float bands=2.3;
  vec3 col=iri(thick*bands + 0.12);

  // silvery-blue sheen on thicker plateaus
  float sheen=smoothstep(0.52,0.92, fbm(p*0.8+r));
  col=mix(col, vec3(0.66,0.72,0.82), sheen*0.5);

  // dark oily base dominates; sheen sits in patches
  float filmAmt=smoothstep(0.34,0.66, fbm(p*0.6+r*1.2+vec2(20.0,7.0)));
  vec3 water=vec3(0.025,0.035,0.048);
  col=mix(water,col,filmAmt);

  // settle: darker overall so sheen reads against near-black oil
  col*=0.80;
  col=clamp(col,0.0,1.0);
  col=col*col*(3.0-2.0*col);
  gl_FragColor=vec4(col,1.0);
}`;

function compile(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s;}
const prog=gl.createProgram();
gl.attachShader(prog,compile(gl.VERTEX_SHADER,VS));
gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(prog);gl.useProgram(prog);

const bq=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,bq);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const aLoc=gl.getAttribLocation(prog,'a');
gl.enableVertexAttribArray(aLoc);
gl.vertexAttribPointer(aLoc,2,gl.FLOAT,false,0,0);

const uRes=gl.getUniformLocation(prog,'res');
const uTime=gl.getUniformLocation(prog,'time');
const uMouse=gl.getUniformLocation(prog,'mouse');
const uMStr=gl.getUniformLocation(prog,'mStr');
const uMClick=gl.getUniformLocation(prog,'mClick');
const uDist=gl.getUniformLocation(prog,'distTex');
const uSeed=gl.getUniformLocation(prog,'seed');
resize();
gl.uniform2f(uSeed,Math.random()*20,Math.random()*20);

// ── pointer drag field (decaying stamps that the flow follows) ──
const distTex=gl.createTexture();
gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,distTex);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
gl.uniform1i(uDist,0);
const DW=240,DH=240;
const distData=new Float32Array(DW*DH);
const distPixels=new Uint8Array(DW*DH*4);
function uploadDist(){
  for(let i=0;i<DW*DH;i++){const v=Math.min(255,Math.max(0,distData[i]*32));distPixels[i*4]=v;distPixels[i*4+1]=v;distPixels[i*4+2]=v;distPixels[i*4+3]=255;}
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,DW,DH,0,gl.RGBA,gl.UNSIGNED_BYTE,distPixels);
}
uploadDist();
function addToDist(x,y,str,radius){ // x,y in bottom-up pixels
  const sx=x/W*DW, sy=y/H*DH;
  const scaleX=DW/W, scaleY=DH/H;
  const srx=radius*scaleX, sry=radius*scaleY;
  const r=Math.ceil(Math.max(srx,sry));
  const x0=Math.max(0,Math.floor(sx-r)),x1=Math.min(DW-1,Math.ceil(sx+r));
  const y0=Math.max(0,Math.floor(sy-r)),y1=Math.min(DH-1,Math.ceil(sy+r));
  for(let py=y0;py<=y1;py++)for(let px=x0;px<=x1;px++){
    const dx=(px-sx)/srx, dy=(py-sy)/sry; const d2=dx*dx+dy*dy;
    if(d2<1){const f=1-d2;distData[py*DW+px]+=str*f*f;}
  }
}

// ── pointer input ──
let mx=W/2,my=H/2,mDown=false,mActive=0,mClick=0,lastX=mx,lastY=my;
function toCv(cx,cy){const r=cv.getBoundingClientRect();return{x:(cx-r.left)*(W/r.width),y:(cy-r.top)*(H/r.height)};}
function moveTo(x,y){
  mx=x;my=y;mActive=Math.min(1,mActive+0.2);
  const sp=Math.hypot(x-lastX,y-lastY);
  addToDist(x,H-y,1.2+Math.min(sp*0.05,3.0)+mClick*2.0,46+mClick*40);
  lastX=x;lastY=y;
}
cv.addEventListener('mousemove',e=>{const p=toCv(e.clientX,e.clientY);moveTo(p.x,p.y);});
cv.addEventListener('mousedown',e=>{mDown=true;const p=toCv(e.clientX,e.clientY);mx=p.x;my=p.y;lastX=p.x;lastY=p.y;addToDist(p.x,H-p.y,4.0,60);});
window.addEventListener('mouseup',()=>{mDown=false;});
cv.addEventListener('mouseleave',()=>{mDown=false;});
cv.addEventListener('touchstart',e=>{const t=e.changedTouches[0];const p=toCv(t.clientX,t.clientY);mDown=true;mx=p.x;my=p.y;lastX=p.x;lastY=p.y;addToDist(p.x,H-p.y,4.0,60);},{passive:true});
cv.addEventListener('touchmove',e=>{const t=e.changedTouches[0];const p=toCv(t.clientX,t.clientY);moveTo(p.x,p.y);},{passive:true});
cv.addEventListener('touchend',()=>{mDown=false;},{passive:true});

window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,100));

let t=0,lastTime=0,fc=0;
function loop(){
  const now=performance.now();const dt=Math.min((now-(lastTime||now))/1000,0.05);lastTime=now;t+=dt;
  mClick+=((mDown?1:0)-mClick)*0.08;
  mActive*=0.94;
  for(let i=0;i<distData.length;i++) distData[i]*=0.985;

  gl.viewport(0,0,W,H);
  gl.uniform2f(uRes,W,H);
  gl.uniform1f(uTime,t);
  gl.uniform2f(uMouse,mx,H-my);
  gl.uniform1f(uMStr,mActive);
  gl.uniform1f(uMClick,mClick);
  fc++; if(fc%2===0) uploadDist();
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
